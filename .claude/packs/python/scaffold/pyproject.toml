# The agency scaffold's pyproject.toml — replaces the one generated by `uv init`.
# No [build-system] on purpose: non-packaged app; `app.*` imports resolve via
# pytest's pythonpath and via the explicit path in the FastAPI CLI.

[project]
name = "my-api"                   # REPLACE: project name in kebab-case
version = "0.1.0"
description = "Agency API — describe the project in one line"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []                 # managed by `uv add` — do not edit by hand

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"
exclude = [".venv", "build", "dist", "node_modules"]

[tool.ruff.lint]
# ruff default = ["E4", "E7", "E9", "F"]; the agency's set:
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# pytest 9+: native [tool.pytest] table with real TOML types (addopts as an array).
# If the team is stuck on pytest 8, move to [tool.pytest.ini_options]
# with addopts = "-ra -q" (single string).
[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
